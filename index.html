<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      height: 100vh;
      margin: 10px;
      background-color: #f2f2f2;
    }

    .container {
      width: 100%;
      box-sizing: border-box;
      background: white;
      padding: 20px 30px;
      border-radius: 8px;
      border: 2px solid red;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
      text-align: center;
    }


    label {
      font-weight: bold;
      font-size: 1rem;
    }

    input {
      width: 50%;
      padding: 8px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #result {
      margin-top: 15px;
      font-size: 1rem;
      color: #333;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Tip Calculator</h1>
    <label for="bill">Bill :
      <input type="number" id="bill" placeholder="Enter bill amount">
    </label>

    <br><br>
    <label for="tip">Tip :
      <input type="number" id="tip" placeholder="Enter tip percentage">
    </label>

    <br><br>

    <button onclick="calculateTip()">Calculate</button>
    <div id="tip_result"></div>
    <div id="result"></div>
  </div>
  <script>
    function calculateTip() {
      const bill = parseFloat(document.getElementById('bill').value);
      const tipPercentage = parseFloat(document.getElementById('tip').value);

      if (isNaN(bill) || isNaN(tipPercentage) || bill <= 0 || tipPercentage < 0) {
        document.getElementById('result').textContent = "Please enter valid inputs.";
        return;
      }

      const tip = (bill * tipPercentage) / 100;
      const total = bill + tip;

      document.getElementById("tip_result").innerHTML = `Tip Amount : ${tip.toFixed(2)}`;
      document.getElementById('result').innerHTML = `Total Amount: Rs.${total.toFixed(2)}`;
    }
  </script>
</body>

</html>
